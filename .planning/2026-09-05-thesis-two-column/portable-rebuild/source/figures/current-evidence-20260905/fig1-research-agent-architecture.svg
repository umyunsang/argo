<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="136mm" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">Proposed integrated research-agent architecture</title>
  <desc id="desc">Six proposed research stages connected to a typed provenance spine. Research refinement and harness refinement have separate lineages. The persistent execution substrate is a proposed architectural layer, not a completed ARGO runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#171717"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 20px; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .proposed { fill: #fff; stroke: #171717; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .record { fill: #f2f2f2; stroke: #171717; stroke-width: 1.6; }
      .flow { fill: none; stroke: #171717; stroke-width: 2; marker-end: url(#arrow); }
      .link { fill: none; stroke: #555; stroke-width: 1.8; stroke-dasharray: 2 5; }
      .rule { stroke: #555; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1000" height="850" fill="#fff"/>
  <text x="30" y="35" class="heading">PROPOSED RESEARCH-AGENT ARCHITECTURE</text>
  <text x="30" y="66">Conceptual design; integrated efficacy not yet evaluated</text>
  <line x1="30" y1="84" x2="970" y2="84" class="rule"/>
  <rect x="30" y="112" width="280" height="130" class="proposed"/>
  <text x="47" y="145" class="label">1  Research question</text>
  <text x="47" y="180">Objective and hypothesis</text>
  <text x="47" y="211">Scope and constraints</text>
  <rect x="360" y="112" width="280" height="130" class="proposed"/>
  <text x="377" y="145" class="label">2  Evidence retrieval</text>
  <text x="377" y="180">Read selected sources</text>
  <text x="377" y="211">Hash and exact locator</text>
  <rect x="690" y="112" width="280" height="130" class="proposed"/>
  <text x="707" y="145" class="label">3  Claim verification</text>
  <text x="707" y="180">Source / claim alignment</text>
  <text x="707" y="211">Protocol and applicability</text>
  <path d="M310 176 H356" class="flow"/>
  <path d="M640 176 H686" class="flow"/>
  <path d="M970 176 H988 V269 H14 V358 H26" class="flow"/>
  <text x="30" y="294">Verified evidence enters candidate comparison</text>
  <rect x="30" y="318" width="280" height="130" class="proposed"/>
  <text x="47" y="351" class="label">4  Compare designs</text>
  <text x="47" y="386">Alternative candidates</text>
  <text x="47" y="417">Comparable protocols</text>
  <rect x="360" y="318" width="280" height="130" class="proposed"/>
  <text x="377" y="351" class="label">5  Bounded experiment</text>
  <text x="377" y="386">Fixed budget and stopping</text>
  <text x="377" y="417">Run / inspect / refine</text>
  <rect x="690" y="318" width="280" height="130" class="proposed"/>
  <text x="707" y="351" class="label">6  Manuscript / evidence</text>
  <text x="707" y="386">Traceable claim support</text>
  <text x="707" y="417">Artifacts and limitations</text>
  <path d="M310 382 H356" class="flow"/>
  <path d="M640 382 H686" class="flow"/>
  <path d="M170 448 V474 H940 M500 448 V474 M830 448 V474 M830 242 V256 H660 V474 M350 474 V513 M610 474 V513 M870 474 V513" class="link"/>
  <text x="30" y="500" class="label">Typed provenance spine</text>
  <rect x="30" y="513" width="210" height="52" class="record"/>
  <rect x="273" y="513" width="210" height="52" class="record"/>
  <rect x="516" y="513" width="210" height="52" class="record"/>
  <rect x="759" y="513" width="211" height="52" class="record"/>
  <text x="135" y="546" text-anchor="middle">Claim</text>
  <text x="378" y="546" text-anchor="middle">Decision</text>
  <text x="621" y="546" text-anchor="middle">Experiment</text>
  <text x="864" y="546" text-anchor="middle">Artifact</text>
  <path d="M240 539 H273 M483 539 H516 M726 539 H759" class="link"/>
  <text x="30" y="594">Source hash + locator · typed links · version + status · audit trail</text>
  <rect x="30" y="619" width="455" height="106" class="proposed"/>
  <rect x="515" y="619" width="455" height="106" class="proposed"/>
  <text x="48" y="649" class="label">Research refinement</text>
  <text x="48" y="681">Revise hypothesis, protocol and design</text>
  <text x="48" y="710">Scientific lineage; bounded stopping</text>
  <text x="533" y="649" class="label">Harness refinement</text>
  <text x="533" y="681">Revise tools and instructions</text>
  <text x="533" y="710">Separate lineage; held-out validation</text>
  <rect x="30" y="745" width="940" height="62" class="record"/>
  <text x="48" y="770">Persistent execution substrate; native implementation remains paused</text>
  <text x="48" y="796">Daemon · persistent REPL · recovery · harness refinement · TUI</text>
  <path d="M32 833 H80" class="flow"/><text x="93" y="839">Workflow</text>
  <path d="M278 833 H326" class="link"/><text x="339" y="839">Record linkage</text>
  <rect x="584" y="822" width="42" height="19" class="proposed"/><text x="640" y="839">Proposed / untested module</text>
</svg>
