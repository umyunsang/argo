<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="132.8mm" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc">
  <title id="title">Stage 0 measurement checks and separate runtime isolation probe</title>
  <desc id="desc">Panel A reports 16 task scorers checked with three valid and three corrupt fixtures each, totaling 96 evaluator executions. Panel B is a separate runtime-policy probe with separate agent and scorer containers. Neither is evidence of integrated-agent efficacy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#171717"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 20px; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .box { fill: #fff; stroke: #171717; stroke-width: 1.8; }
      .record { fill: #f2f2f2; stroke: #171717; stroke-width: 1.8; }
      .flow { fill: none; stroke: #171717; stroke-width: 2; marker-end: url(#arrow); }
      .rule { stroke: #777; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1000" height="830" fill="#fff"/>
  <text x="30" y="35" class="heading">STAGE 0: TWO DISTINCT EVIDENCE PATHS</text>
  <text x="30" y="66">Completed instrument checks and runtime-policy probe, 2026-09-05 KST</text>
  <line x1="30" y1="84" x2="970" y2="84" class="rule"/>
  <text x="30" y="119" class="label">A  Scorer fixture checks — not agent executions</text>
  <rect x="30" y="140" width="280" height="139" class="box"/>
  <rect x="360" y="140" width="280" height="139" class="box"/>
  <rect x="690" y="140" width="280" height="139" class="record"/>
  <text x="47" y="175" class="label">Fixture submissions</text>
  <text x="47" y="211">16 tasks × 6 checks</text>
  <text x="47" y="244">3 valid + 3 corrupt / task</text>
  <text x="377" y="175" class="label">Task scorers</text>
  <text x="377" y="211">96 evaluator executions</text>
  <text x="377" y="244">48 valid / 48 corrupt</text>
  <text x="707" y="175" class="label">Separately rechecked</text>
  <text x="707" y="211">96 manifests rederived</text>
  <text x="707" y="244">6 mutations detected</text>
  <path d="M310 208 H356" class="flow"/>
  <path d="M640 208 H686" class="flow"/>
  <text x="30" y="313">PASS applies to scorer checks; these are not 96 integrated-agent runs.</text>
  <line x1="30" y1="337" x2="970" y2="337" class="rule"/>
  <text x="30" y="373" class="label">B  Separate runtime isolation probe</text>
  <rect x="30" y="399" width="284" height="166" class="box"/>
  <rect x="369" y="434" width="228" height="96" class="record"/>
  <rect x="654" y="399" width="316" height="166" class="box"/>
  <text x="47" y="434" class="label">Agent container</text>
  <text x="47" y="470">Untrusted; NO gold / oracle</text>
  <text x="47" y="503">NO network access</text>
  <text x="47" y="543">Probe; no model call</text>
  <text x="483" y="472" text-anchor="middle" class="label">Submission</text>
  <text x="483" y="505" text-anchor="middle">Probe artifact only</text>
  <text x="671" y="434" class="label">Scorer container</text>
  <text x="671" y="470">Separate from agent</text>
  <text x="671" y="503">Read-only oracle + input</text>
  <text x="671" y="543">Same pinned image</text>
  <path d="M314 481 H365" class="flow"/>
  <path d="M597 481 H650" class="flow"/>
  <path d="M172 565 V599" class="flow"/>
  <path d="M812 565 V599" class="flow"/>
  <rect x="30" y="603" width="940" height="112" class="record"/>
  <text x="48" y="636" class="label">Receipt: separately rechecked</text>
  <text x="48" y="669">Direct path / symlink / external and loopback network probes</text>
  <text x="48" y="701">Runtime policy PASS; fully certified integrated tasks = 0</text>
  <line x1="30" y1="742" x2="970" y2="742" class="rule"/>
  <text x="30" y="777" class="label">Instrument evidence only; integrated runner uncertified;</text>
  <text x="30" y="809" class="label">no efficacy result.</text>
</svg>
