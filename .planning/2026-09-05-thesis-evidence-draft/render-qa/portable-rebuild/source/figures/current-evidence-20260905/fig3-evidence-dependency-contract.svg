<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="139.2mm" viewBox="0 0 1000 870" role="img" aria-labelledby="title desc">
  <title id="title">Proposed typed evidence dependency and handoff contract</title>
  <desc id="desc">Sources with a hash and locator support or contradict claims. Decisions derive from claims, experiments derive from decisions, and artifacts derive from experiments. A source retraction triggers requires_recheck for the affected claim and dependent records; it does not automatically falsify them. Proposed contract for dependency tracking and re-evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#171717"/></marker>
    <marker id="open" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#171717" stroke-width="1.4"/></marker>
    <marker id="bar" viewBox="0 0 10 12" refX="8" refY="6" markerWidth="8" markerHeight="10" orient="auto"><path d="M8 1 V11" fill="none" stroke="#171717" stroke-width="1.8"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 20px; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .record { fill: #f2f2f2; stroke: #171717; stroke-width: 1.8; }
      .box { fill: #fff; stroke: #171717; stroke-width: 1.8; }
      .proposed { fill: none; stroke: #555; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .support { fill: none; stroke: #171717; stroke-width: 2; marker-end: url(#arrow); }
      .derived { fill: none; stroke: #171717; stroke-width: 2; marker-end: url(#open); }
      .counter { fill: none; stroke: #171717; stroke-width: 2; marker-end: url(#bar); }
      .recheck { fill: none; stroke: #171717; stroke-width: 2; stroke-dasharray: 9 4 2 4; marker-end: url(#arrow); }
      .handoff { fill: none; stroke: #555; stroke-width: 1.8; stroke-dasharray: 2 5; }
      .rule { stroke: #777; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1000" height="870" fill="#fff"/>
  <text x="30" y="35" class="heading">TYPED EVIDENCE DEPENDENCY GRAPH</text>
  <text x="30" y="66">PROPOSED CONTRACT — dependency tracking and re-evaluation</text>
  <line x1="30" y1="84" x2="970" y2="84" class="rule"/>
  <text x="30" y="119" class="label">A  Traceable records and typed relations</text>
  <rect x="14" y="135" width="972" height="347" class="proposed"/>
  <rect x="30" y="180" width="260" height="97" class="record"/>
  <rect x="370" y="180" width="260" height="97" class="record"/>
  <rect x="710" y="180" width="260" height="97" class="record"/>
  <text x="48" y="217" class="label">Source</text>
  <text x="48" y="252">Hash + exact locator</text>
  <text x="388" y="217" class="label">Claim</text>
  <text x="388" y="252">Statement + status</text>
  <text x="728" y="217" class="label">Decision</text>
  <text x="728" y="252">Choice + rationale</text>
  <path d="M290 230 H366" class="support"/>
  <text x="330" y="164" text-anchor="middle">supports</text>
  <path d="M710 230 H634" class="derived"/>
  <text x="670" y="164" text-anchor="middle">derived_from</text>
  <rect x="30" y="368" width="260" height="97" class="box"/>
  <rect x="370" y="368" width="260" height="97" class="record"/>
  <rect x="710" y="368" width="260" height="97" class="record"/>
  <text x="48" y="405" class="label">Counter-source</text>
  <text x="48" y="440">Hash + exact locator</text>
  <text x="388" y="405" class="label">Artifact</text>
  <text x="388" y="440">Receipt / manuscript</text>
  <text x="728" y="405" class="label">Experiment</text>
  <text x="728" y="440">Run + protocol</text>
  <path d="M160 368 V313 H500 V281" class="counter"/>
  <text x="330" y="344" text-anchor="middle">contradicts</text>
  <path d="M630 418 H706" class="derived"/>
  <text x="670" y="352" text-anchor="middle">derived_from</text>
  <path d="M840 368 V281" class="derived"/>
  <text x="850" y="329">derived_from</text>
  <text x="30" y="515">derived_from points from a dependent record to its parent evidence.</text>
  <text x="30" y="554" class="label">B  Retraction propagation and agent handoff</text>
  <rect x="14" y="571" width="972" height="208" class="proposed"/>
  <rect x="30" y="596" width="245" height="78" class="box"/>
  <text x="48" y="628" class="label">Retracted source</text>
  <text x="48" y="656">Preserve source hash</text>
  <path d="M275 636 H401" class="recheck"/>
  <text x="340" y="590" text-anchor="middle">requires_recheck</text>
  <rect x="405" y="596" width="215" height="78" class="record"/>
  <text x="423" y="628" class="label">Affected claim</text>
  <text x="423" y="656">Recheck support</text>
  <text x="30" y="713">Traverse reverse dependencies:</text>
  <text x="30" y="745">decision → experiment → artifact</text>
  <rect x="658" y="596" width="312" height="161" class="record"/>
  <text x="676" y="628" class="label">Agent handoff view</text>
  <text x="676" y="661">IDs / hashes / versions</text>
  <text x="676" y="694">STALE + recheck queue</text>
  <text x="676" y="727">Evidence retained; no deletion</text>
  <path d="M620 636 H658" class="handoff"/>
  <path d="M32 808 H76" class="support"/><text x="90" y="815">supports</text>
  <path d="M351 808 H395" class="counter"/><text x="409" y="815">contradicts</text>
  <path d="M661 808 H705" class="derived"/><text x="719" y="815">derived_from</text>
  <path d="M32 845 H76" class="recheck"/><text x="90" y="852">requires_recheck</text>
  <rect x="351" y="835" width="44" height="18" class="proposed"/><text x="409" y="852">Proposed contract</text>
  <path d="M661 845 H705" class="handoff"/><text x="719" y="852">Handoff view</text>
</svg>
